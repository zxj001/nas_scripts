name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: pip install pytest ruff
      - run: ruff check setup_core setup_tasks scripts/build_setup.py tests/test_setup_runner.py tests/test_setup_tasks.py tests/test_setup_distribution.py
      - run: python3 -m pytest
      - run: python3 scripts/build_setup.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: setup-bundle
          path: dist/setup.pyz*
  macos-setup:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest shellcheck-py
      - run: python3 -m pytest tests/test_setup_runner.py tests/test_setup_tasks.py tests/test_setup_distribution.py tests/test_setup_sh.py
  debian-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash tests/integration/debian.sh
